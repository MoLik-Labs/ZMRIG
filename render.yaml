# Render blueprint: one service, three jobs.
#
#   Render -> New -> Blueprint -> this repository -> apply
#   then fill in the variables marked `sync: false` once, and never again.
#
# ## Why exactly one service
#
# A free workspace gets **750 instance hours per calendar month**, shared by
# every free service in it. A 31-day month is 744 hours. So exactly one
# always-on service fits; a second one puts the workspace over the limit, and
# Render then suspends the free services until the next month. That is not a
# bill, it is an outage, and it is the reason a blueprint with two `type: web`
# services is a blueprint that stops working in week five.
#
# One process therefore does all of it (`host/server.js`):
#
#   the bots     Telegram and/or Discord long-poll, from TELEGRAM_BOT_TOKEN and
#                DISCORD_BOT_TOKEN below
#   the rigs     POST /v1/hello, the device protocol, unchanged
#   the people   the documentation site at /, /download and /iso/<channel>,
#                served from the committed `web/` directory
#
# One port, one health check, one thing to restart.
#
# ## Why there is no build step
#
# `web/` is the committed build of `site/` — the same bytes GitHub Pages serves
# from the same commit. Serving it needs no `npm install` and no Docusaurus
# build, so a deploy costs no build minutes and cannot fail on a dependency
# that published a broken minor version. The repository has no runtime
# dependencies at all: `fleet/`, `serve/`, `lib/` and `host/` are plain Node.
#
# The site is regenerated by `scripts/publish-site.sh`, which is a deliberate
# local action, not a deploy step.
#
# ## Nothing is stored
#
# The filesystem is ephemeral — emptied on every deploy, restart and spin-down.
# The fleet's memory is the environment: FLEET_ROSTER says who the rigs are and
# what they should be running, and every check-in is reconciled against it, so
# a restart changes nothing. FLEET_STATE is a scratch cache, nothing more.
#
# ## Unused free services
#
# The pool and the standalone dashboard each have their own file, for whoever
# wants to run them instead of this: `deploy/render-pool.yaml` and
# `fleet/render.yaml`. Applying either one to the *same* workspace puts it over
# the hour limit. Use a second workspace, or a paid plan.
services:
  - type: web
    name: zmrig
    runtime: node
    plan: free
    region: frankfurt
    # The repository root, because the process reads three directories: `host/`,
    # `fleet/` and `web/`.
    rootDir: .
    # A YAML value with a colon inside it has to be quoted as a whole; the inner
    # quotes do not protect it, and the blueprint is rejected at parse time.
    buildCommand: 'echo "no build: zero dependencies, site is committed"'
    startCommand: node host/server.js
    healthCheckPath: /healthz
    # Every rig checks in once a minute, so the service stays awake on its own
    # while there is a fleet to serve. See doc/FLEET.md for the arithmetic and
    # for the keep-alive workflow that covers an empty fleet.
    autoDeploy: true

    envVars:
      # --- secrets: Render asks for these and never reads them from the repo
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: FLEET_ADMIN_IDS
        sync: false
      - key: DISCORD_ADMIN_IDS
        sync: false
      # The fleet itself. See fleet/roster.example.json for the shape. This is
      # the only durable state the service has, which is why it is here and not
      # in a file.
      - key: FLEET_ROSTER
        sync: false
      # https://<service>.onrender.com, or the custom domain. Used for the
      # canonical links in the pages; Render's own RENDER_EXTERNAL_URL is the
      # fallback when it is empty.
      - key: FLEET_PUBLIC_URL
        sync: false
      # The browser dashboard. There is no dashboard on this host: the front
      # door is the documentation. Run `fleet/` on its own to get it back.
      # FLEET_WEB_PASSWORD is deliberately not listed here.

      # --- not secret, set here so a deploy is reproducible
      # A scratch cache, not state: losing it costs one round of "what was this
      # rig doing", which the next check-in answers.
      - key: FLEET_STATE
        value: /tmp/fleet.json
      - key: FLEET_INTERVAL
        value: 60
      - key: FLEET_ALERT_TEMP
        value: 85
      # Where the pages come from. Relative to the repository root; overriding it
      # is how you serve a different build (for example an uncommitted one).
      - key: SITE_ROOT
        value: web
      # Release data for /download and /iso/<channel>, cached for ten minutes.
      - key: GITHUB_REPO
        value: MoLik-Labs/ZMRIG
      - key: RELEASES_TTL
        value: 600000
      - key: NODE_VERSION
        value: 22
