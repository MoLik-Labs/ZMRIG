# Render blueprint: the control plane — Telegram bot, Discord bot and the web
# dashboard, in one process.
#
#   Render -> New -> Blueprint -> this repository -> apply
#   then fill in the variables marked `sync: false` once, and never again.
#
# Why one service and not two: a free workspace gets **750 instance hours per
# calendar month**, shared by every free service. A 31-day month is 744 hours,
# so exactly one always-on service fits and a second one puts the workspace over
# the limit, at which point Render suspends the free services until the next
# month. The pool is therefore not part of this blueprint: it is needed only
# while somebody is actually mining, and it has its own file next to this one
# (deploy/render-pool.yaml) for whoever wants to run it.
#
# Nothing is stored on this host. The filesystem is ephemeral - emptied on every
# deploy, restart and spin-down - so the fleet's memory is the environment:
# FLEET_ROSTER says who the rigs are and what they should be running, and every
# check-in is reconciled against it. A restart changes nothing.
services:
  - type: web
    name: zmrig-fleet
    runtime: node
    plan: free
    region: frankfurt
    rootDir: fleet
    # Zero dependencies, so there is nothing to install and nothing to trust.
    # A YAML value with a colon inside it has to be quoted as a whole; the inner
    # quotes do not protect it, and the blueprint is rejected at parse time.
    buildCommand: 'echo "no build: zero dependencies"'
    startCommand: node src/index.js
    healthCheckPath: /healthz
    # Every rig checks in once a minute, which is traffic, so the service stays
    # awake on its own while there is a fleet to serve. See doc/FLEET.md for the
    # arithmetic and for the keep-alive workflow that covers an empty fleet.
    autoDeploy: true

    envVars:
      # --- secrets: Render asks for these and never reads them from the repo
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: FLEET_ADMIN_IDS
        sync: false
      - key: DISCORD_ADMIN_IDS
        sync: false
      # The dashboard at /. Leave it empty to run the chats only.
      - key: FLEET_WEB_PASSWORD
        sync: false
      # The fleet itself. See fleet/roster.example.json for the shape.
      - key: FLEET_ROSTER
        sync: false
      - key: FLEET_PUBLIC_URL
        sync: false

      # --- not secret, set here so a deploy is reproducible
      # A scratch cache, not state: losing it costs one round of "what was this
      # rig doing", which the next check-in answers.
      - key: FLEET_STATE
        value: /tmp/fleet.json
      - key: FLEET_INTERVAL
        value: 60
      - key: FLEET_ALERT_TEMP
        value: 85
      - key: NODE_VERSION
        value: 22
