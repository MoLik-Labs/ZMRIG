name: Test builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Ubuntu ${{ matrix.arch }} build and hash tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            libhwloc-dev \
            libssl-dev \
            libuv1-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Run safe test subset
        run: node run_tests.js --safe --build-dir build

      # Full local suite: node run_tests.js

  # The Zig engine had no CI at all: cli.sh, unit.sh, net.sh, health.sh and
  # thermal.sh ran only on the machine that wrote them, which is how a suite
  # that passes locally and a suite that passes nowhere look the same.
  #
  # x86-64 only: the static build and the CUDA-free C++ engine are what the
  # release binaries are, and the arm64 runner is used by the XMRig matrix
  # above for the same source tree.
  zmrig:
    name: zmrig engine build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3-pip
          # zig 0.13, and only 0.13: the runner's own zig is newer and does not
          # compile this code. scripts/find-zig.sh decides, and says which.
          python3 -m pip install --break-system-packages --quiet ziglang==0.13.0

      - name: Build
        run: ./zmrig/build.sh --jobs "$(nproc)"

      - name: Report the toolchain
        run: |
          echo "zig:      $(./scripts/find-zig.sh) -> $(./scripts/find-zig.sh | xargs -r -I{} {} version)"
          echo "cpus:     $(nproc)"
          echo "memory:   $(free -m | awk '/^Mem:/ {print $2 " MiB"}')"

      - name: Unit tests (every module)
        run: ./zmrig/tests/unit.sh

      - name: Hash engine (C API, reference vectors)
        run: ./zmrig/tests/run.sh --quick

      - name: CLI
        run: ./zmrig/tests/cli.sh

      - name: Stratum and transport
        run: ./zmrig/tests/net.sh

      - name: Watchdog against a real pool
        run: ./zmrig/tests/health.sh

      # The safe mode, end to end: the governor is driven through
      # --thermal-file, because a test that needed a genuinely hot CPU would
      # either never run or cost somebody a machine.
      - name: Thermal governor against a real process
        run: ./zmrig/tests/thermal.sh

  # The control plane. Zero dependencies, so this is `node --test` and nothing
  # to install; the agent half runs against the same server in os/tests/fleet.sh.
  fleet:
    name: fleet (bot and agent)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Node
        run: node --version

      - name: Bot, store, protocol and handlers
        run: cd fleet && npm test

      - name: Configuration check (no token needed)
        run: cd fleet && node src/index.js --check || true

      - name: Rig agent against the real server
        run: bash os/tests/fleet.sh

      - name: The download helper
        run: bash tests/releases/latest-iso.test.sh

  # The image Render builds. Without this job the first person to find out that
  # `deploy/Dockerfile` no longer compiles is whoever deployed it: a Render build
  # failure shows two lines of a log and one source file name, which is how a
  # missing libc6-dev header was reported as a broken blake2b_avx2.c.
  image:
    name: Pool image (docker build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build it the way Render does
        run: docker build -f deploy/Dockerfile -t ocean-pool:ci .

      # The verifier is the reason the image contains a miner at all: the pool
      # cannot trust a share it cannot hash.
      - name: The verifier inside the image runs
        run: |
          docker run --rm --entrypoint /usr/local/bin/zmrig ocean-pool:ci --version
          docker run --rm --entrypoint /usr/local/bin/zmrig ocean-pool:ci --self-test=light

      - name: The pool answers, with nothing mounted
        run: |
          docker run -d --name pool -p 18080:8080 \
            -e DAEMON= -e POOL_NAME=ci ocean-pool:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz | tee /dev/stderr | grep -q '"ok"'
          docker logs pool | tail -20
          docker rm -f pool

  macos:
    name: macOS ${{ matrix.arch }} build and hash tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            uname: arm64
          - runner: macos-15-intel
            arch: x64
            uname: x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.uname }}"

      - name: Install build dependencies
        run: |
          missing=()
          for formula in autoconf automake cmake libtool libuv openssl@3; do
            brew list --formula "$formula" >/dev/null 2>&1 || missing+=("$formula")
          done
          if ((${#missing[@]})); then
            brew install "${missing[@]}"
          fi

      - name: Build static hwloc
        run: |
          HWLOC_VERSION=2.12.1
          curl -fsSLO "https://download.open-mpi.org/release/hwloc/v2.12/hwloc-${HWLOC_VERSION}.tar.gz"
          tar xzf "hwloc-${HWLOC_VERSION}.tar.gz"
          cd "hwloc-${HWLOC_VERSION}"
          ./configure --disable-shared --enable-static --disable-io --disable-libudev --disable-libxml2
          make -j"$(sysctl -n hw.logicalcpu)"

      - name: Configure
        run: |
          OPENSSL_ROOT="$(brew --prefix openssl@3)"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT" \
            -DHWLOC_INCLUDE_DIR="$PWD/hwloc-2.12.1/include" \
            -DHWLOC_LIBRARY="$PWD/hwloc-2.12.1/hwloc/.libs/libhwloc.a"

      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.logicalcpu)"

      - name: Run safe test subset
        run: node run_tests.js --safe --build-dir build

      # Full local suite: node run_tests.js

  windows:
    name: Windows build and hash tests
    runs-on: windows-2025-vs2026
    timeout-minutes: 60

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            base-devel
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nodejs

      - name: Checkout XMRig deps
        run: git clone --depth 1 https://github.com/xmrig/xmrig-deps.git

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DXMRIG_DEPS="$PWD/xmrig-deps/gcc/x64"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run safe test subset
        run: BUILD_PARALLEL=2 node run_tests.js --safe --build-dir build --cmake-generator Ninja
