# ZMRIG OS image build: assemble the live image, boot it in QEMU, publish it.
#
# Runs on every push to BETA or master that touches the appliance, the miner or
# the tuner, on tags, and on a pull request that touches the same paths -- a
# workflow that only ever runs after a merge is a workflow nobody has tested.
#
# Publishing is deliberate: a push builds and uploads an artifact, a tag or a
# manual run with publish=true creates the release, and every past version stays
# downloadable because assets are replaced in place (--clobber), not the release.
#
name: Appliance image

# Builds the bootable ZMRIG OS image.
#
# Every push to BETA or master rebuilds it with the code of that commit, so the
# image a rig downloads is never older than the release notes. Versioned
# releases are created on tags and on master pushes (one release per version,
# assets replaced in place, so every past version stays downloadable); BETA
# publishes a rolling pre-release.
#
# Nothing here needs a GPU, a KVM host or a secret: the ISO is cross-built.

on:
  push:
    branches: [BETA, master]
    tags: ['v*']
    paths:
      - 'os/**'
      - 'zmrig/**'
      - 'scripts/tune-linux.sh'
      - '.github/workflows/os.yml'
  pull_request:
    paths:
      - 'os/**'
      - 'zmrig/**'
      - 'scripts/tune-linux.sh'
      - '.github/workflows/os.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Attach the images to a release'
        type: boolean
        default: true
      channel:
        description: 'Release channel'
        type: choice
        options: [beta, stable]
        default: beta

permissions:
  contents: write

concurrency:
  group: os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control:
    name: zmrig-os control tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          # Only real errors fail the job: the scripts are POSIX sh on purpose,
          # and shellcheck's stylistic notes about `local` are not worth a build.
          shellcheck -s sh -S error \
            os/overlay/usr/local/bin/zmrig-os \
            os/overlay/usr/local/lib/zmrig/firstboot.sh \
            os/init os/chroot-setup.sh os/make-initramfs.sh

      - name: Self-check (files, syntax, exec bits)
        run: bash os/build-iso.sh --self-check

      - name: Control tool
        run: bash os/tests/control.sh

  iso:
    name: ISO ${{ matrix.arch }}
    needs: control
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x86-64-v3, x86-64-v2]

    steps:
      - uses: actions/checkout@v5

      - name: Cache the Alpine base system
        uses: actions/cache@v4
        with:
          path: /tmp/zmrig-os-build/cache
          key: alpine-latest-stable-minirootfs

      - name: Install the ISO toolchain
        run: sudo ./os/deps.sh

      # Which compiler actually got picked, and from where. The miner is
      # written for Zig 0.13 and the runner ships a newer one; when this line
      # said 0.15 the build failed 200 lines later with an error that pointed at
      # the source instead of the toolchain.
      - name: Report the toolchain
        run: |
          echo "zig:      $(./scripts/find-zig.sh) -> $(./scripts/find-zig.sh | xargs -r -I{} {} version)"
          echo "mksquashfs: $(mksquashfs -version 2>&1 | head -1)"
          echo "xorriso:  $(xorriso -version 2>&1 | head -1)"
          echo "grub:     $(grub-mkrescue --version 2>&1 | head -1)"

      - name: Build the image
        run: |
          set -o pipefail
          sudo ./os/build-iso.sh --arch "${{ matrix.arch }}" --out dist 2>&1 | tee build.log

      # A failed step otherwise says "exit code 1" and nothing else; the log
      # lives in a blob store that is not readable from everywhere. The last
      # lines of the build become an annotation on the commit, which is where
      # a maintainer looks first anyway.
      - name: Explain the failure
        if: failure()
        run: |
          [ -s build.log ] || { echo "no build log was written"; exit 0; }
          # The tail alone is misleading: warnings trail the one line that
          # matters, and a compile that spawns four processes buries it. Take
          # the errors by name first, then the last few lines for context.
          {
            grep -m 12 -E 'error: |fatal error|undefined reference|cannot find' build.log || true
            echo "---"
            tail -n 10 build.log
          } | sed -e 's/%/%25/g' -e 's/\r//g' -e 's/::/#/g' -e 's/^/| /' \
            | awk 'BEGIN{ORS=""} {print $0 "%0A"}' > annotation.txt
          echo "::error title=ISO build failed::$(cat annotation.txt)"
          echo "---- errors ----"
          cat annotation.txt

      - name: Boot it in QEMU
        # One architecture is enough to prove the image reaches userspace; the
        # other differs only in the compiler flags of the miner it contains.
        if: matrix.arch == 'x86-64-v3'
        run: |
          sudo ./os/smoke-qemu.sh "$(ls dist/*.iso | head -1)" | tee smoke.log
        env:
          BOOT_TIMEOUT: 900

      - name: Show what was built
        run: |
          ls -lh dist/
          cat dist/*.iso.json

      - uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.arch }}
          path: |
            dist/*.iso
            dist/*.iso.sha256
            dist/*.iso.json
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish the images
    needs: iso
    if: |
      github.event_name != 'pull_request' && (
        (github.event_name == 'workflow_dispatch' && inputs.publish) ||
        startsWith(github.ref, 'refs/tags/v')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHANNEL: ${{ inputs.channel || 'stable' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Work out the tag
        id: tag
        run: |
          VERSION=$(sed -n 's/^pub const version = "\(.*\)";/\1/p' zmrig/src/main.zig | head -1)

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "BETA" ]; then
            echo "tag=os-beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create the release if it does not exist
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PRE="${{ steps.tag.outputs.prerelease }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi

          # The notes are written to a file: backticks inside a `run:` block are
          # a command substitution, and the sentence that explains `dd` would
          # have become a command that overwrites a disk.
          NOTES=$(mktemp)
          {
            printf 'Bootable ZMRIG OS image, built from %s.\n\n' "${GITHUB_SHA:0:8}"
            cat <<'EOF'
          Write it to a stick and boot it:

              dd if=zmrig-os-*.iso of=/dev/sdX bs=4M status=progress conv=fsync

          The wizard asks for your wallet on the console on the first boot, or
          pass `zmrig.os.wallet=4...` on the kernel command line. Nothing is
          installed to any disk, and nothing on the stick is modified.

          x86-64-v3 needs AVX2 (any x86 CPU since ~2015); x86-64-v2 runs on
          everything since Nehalem. The .json next to each image is the manifest
          `zmrig-os update` reads.
          EOF
          } > "$NOTES"

          if [ "$PRE" = "true" ]; then
            gh release create "$TAG" --title "ZMRIG OS (rolling beta)" \
              --notes-file "$NOTES" --prerelease
          else
            gh release create "$TAG" --title "ZMRIG OS ${{ steps.tag.outputs.version }}" \
              --notes-file "$NOTES"
          fi

      - name: Attach the images and the channel manifests
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          # One manifest per channel and per instruction level: the updater on a
          # rig asks for the level its own image was compiled for.
          for meta in dist/*.iso.json; do
            arch=$(sed -n 's/.*"arch": "\(.*\)",/\1/p' "$meta" | head -1)
            cp "$meta" "dist/zmrig-os-${CHANNEL}-${arch}.json"
          done

          gh release upload "$TAG" \
            dist/*.iso dist/*.iso.sha256 dist/zmrig-os-*-*.json \
            --clobber

      - name: Summarise
        run: |
          {
            echo "### ZMRIG OS ${{ steps.tag.outputs.version }}"
            echo
            echo "| file | size | sha256 |"
            echo "| --- | ---: | --- |"
            for iso in dist/*.iso; do
              echo "| $(basename "$iso") | $(du -h "$iso" | cut -f1) | $(cut -d' ' -f1 "$iso.sha256") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
