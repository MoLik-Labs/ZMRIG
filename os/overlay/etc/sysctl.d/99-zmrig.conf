# Kernel settings a miner wants and the miner cannot set itself.
#
# Each line is here for a measured or mechanical reason; nothing is copied from
# a "gaming tweak" list. Reverting is `sysctl --system` after deleting this file.

# Mining memory is a 2.3 GiB dataset that must never leave RAM. Swapping it out
# and back in costs more hashrate than every tuning line below gains together.
vm.swappiness = 1

# Write-back throttle. A log rotation or an image update should not stall the
# mining threads behind 200 MB of dirty pages.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15

# On a multi-socket box, reclaiming one NUMA node before the other turns a
# recoverable memory shortage into a stall on the node that is still healthy.
vm.zone_reclaim_mode = 0

# The kernel migrates pages between NUMA nodes while a program runs, to keep
# each thread near its memory. A miner walks a 2.3 GiB dataset uniformly at
# random, so there is no locality to find and every migration is a stalled hash;
# on a single-socket machine the knob exists and does nothing. `scripts/
# tune-linux.sh` has done this for desktops since 6.30 and the image did not, so
# an installed rig was the one place it stayed on.
kernel.numa_balancing = 0

# Keep 64 MiB genuinely free so a burst allocation (a pool reconnect, an
# `zmrig-os update`) never triggers synchronous reclaim during hashing.
vm.min_free_kbytes = 65536

# The NMI watchdog fires every second on every core to detect lockups nothing
# has ever detected on a mining rig; it costs a little and audits nothing here.
kernel.nmi_watchdog = 0

# A dead pool should be noticed in seconds, not after the kernel's two-hour
# default, so the failover happens while the rig still has work queued.
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 6
net.core.somaxconn = 1024
