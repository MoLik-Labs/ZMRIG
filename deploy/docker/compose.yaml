# The published zmrig image, as a compose service.
#
#   cp deploy/docker/compose.yaml .
#   WALLET=4... POOL=pool.example:3333 docker compose up -d
#   docker compose logs -f
#
# Both variables are required and neither has a default on purpose: a rig with a
# placeholder wallet hashes for nobody, and a default pool would be choosing a
# custodian on the operator's behalf. `:?` makes compose stop before it starts
# anything, with the name of the variable it needs.
#
# Updating is `zmrig-docker-update --apply` (this directory), or the timer next
# to it. `pull_policy: always` is what makes a plain `docker compose up -d`
# notice a new image; it does not pull by itself.

services:
  zmrig:
    image: ghcr.io/molik-labs/zmrig:${ZMRIG_TAG:-latest}
    pull_policy: always
    container_name: zmrig
    restart: unless-stopped

    environment:
      WALLET: ${WALLET:?set WALLET to the address this rig is paid to}
      POOL: ${POOL:?set POOL to host:port, or tls://host:port}
      WORKER: ${WORKER:-}
      # max = every core at full speed (the default, and what "maximum
      # performance" means); eco = the same work per watt; safe adds the thermal
      # governor; light needs 256 MiB instead of 2 GiB.
      MODE: ${MODE:-max}
      ALGO: ${ALGO:-auto}
      THREADS: ${THREADS:-auto}
      DONATE: ${DONATE:-3}
      SAFE_TEMP: ${SAFE_TEMP:-72}
      MSR: ${MSR:-auto}
      API_PORT: ${API_PORT:-0}
      API_TOKEN: ${API_TOKEN:-}
      EXTRA_ARGS: ${EXTRA_ARGS:-}

    # Nothing is persisted: the config is the environment and the log is the
    # container's stdout. `docker compose logs` is the log file.
    #
    # A miner needs no privileges. Huge pages are reserved by the *host*
    # (`sysctl vm.nr_hugepages`, or `zmrig-os hugepages`); to let the container
    # use them, add:
    #
    #   cap_add: [IPC_LOCK]
    #   volumes: ["/dev/hugepages:/dev/hugepages"]
    #
    # MSR writes need /dev/cpu/*/msr, which is a host-level decision and a
    # security trade (it lets the container poke CPU registers): leave MSR=auto
    # and the miner's probe will say no.

    # `docker stop` sends SIGTERM to tini, which forwards it to the shim, which
    # forwards it to the miner: it logs its last hashrate instead of being killed.
    stop_grace_period: 20s

    # Uncomment to watch the miner's own API (API_PORT=8080 above):
    # ports: ["127.0.0.1:8080:8080"]

  # The other job in the same image, for whoever wants to run the pool next to
  # the rig. `docker compose --profile pool up -d`. It needs a daemon and an
  # operator wallet or it refuses to start - see doc/POOLS.md.
  pool:
    image: ghcr.io/molik-labs/zmrig:${ZMRIG_TAG:-latest}
    pull_policy: always
    container_name: zmrig-pool
    restart: unless-stopped
    profiles: ["pool"]
    command: ["pool"]
    environment:
      DAEMON: ${DAEMON:-}
      OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
      POOL_FEE_PERCENT: ${POOL_FEE_PERCENT:-1}
      HTTP_PORT: "8080"
    ports:
      - "3333:3333"
      - "8080:8080"
    volumes:
      - pool-data:/app/pool/data

volumes:
  pool-data:
